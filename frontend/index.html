<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111820">
    <title>BrickHUD</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <main class="hud" id="hud">
        <header class="hud-header">
            <div>
                <span class="eyebrow">BRICKHUD</span>
                <h1>Room 01</h1>
            </div>
            <div class="room-size">4200 × 6000</div>
        </header>

        <section class="wall-card">
            <div class="wall-heading">
                <span>BACK WALL</span>
                <strong>4200 mm</strong>
            </div>

            <div class="wall-visual" aria-label="Back wall with three windows">
                <button class="window" data-window="1"><span>W1</span><small>WINDOW 1</small></button>
                <div class="pier"></div>
                <button class="window" data-window="2"><span>W2</span><small>WINDOW 2</small></button>
                <div class="pier"></div>
                <button class="window" data-window="3"><span>W3</span><small>WINDOW 3</small></button>
            </div>

            <div class="wall-caption">
                <span>ROOM DEPTH</span>
                <strong>6000 mm</strong>
            </div>
        </section>

        <section class="selector">
            <p>SELECT OPENING</p>
            <div class="selector-buttons">
                <button data-select="1">Window 1</button>
                <button data-select="2">Window 2</button>
                <button data-select="3">Window 3</button>
            </div>
        </section>

        <section class="readout" id="readout">
            <span>BACK WALL</span>
            <strong>Select a window</strong>
            <p>Tap an opening to focus it.</p>
        </section>

        <button class="camera-launch" id="camera-launch" type="button">
            SET ANCHOR
        </button>
    </main>

    <section class="camera-view" id="camera-view" hidden>
        <div class="camera-stage" id="camera-stage">
            <video id="camera-video" autoplay playsinline muted></video>

            <div class="camera-topbar">
                <button id="camera-close" type="button">CLOSE</button>
                <div>
                    <span>BRICKHUD</span>
                    <strong id="camera-opening">BED 1 · ALIGN ROOM</strong>
                </div>
            </div>

            <div class="camera-instruction" id="camera-instruction">
                Tap a known point from the BED 1 plan.
            </div>

            <div class="anchor-picker" id="anchor-picker" hidden>
                <div class="anchor-picker-card">
                    <strong>WHAT DID YOU TAP?</strong>
                    <select id="anchor-reference"></select>

                    <div class="anchor-picker-actions">
                        <button id="anchor-cancel" type="button">CANCEL</button>
                        <button id="anchor-confirm" type="button">SET ANCHOR</button>
                    </div>
                </div>
            </div>

            <div class="anchor-marker" id="anchor-marker" hidden>
                <div class="anchor-crosshair"></div>
                <strong data-anchor-label></strong>
            </div>

            <div class="alignment-controls" id="alignment-controls">
                <div id="alignment-status">
                    SET AT LEAST 3 ANCHORS
                </div>

                <button
                    id="align-room"
                    type="button"
                    disabled
                >
                    ALIGN BED 1
                </button>

                <button
                    id="walk-ar"
                    type="button"
                >
                    ENTER WALK AR
                </button>
            </div>
        </div>
    </section>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
